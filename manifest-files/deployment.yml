apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetris-v2
  labels:
    app: tetris-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tetris-v2
  template:
    metadata:
      labels:
        app: tetris-v2
    spec:
      containers:
        - name: tetris-v2
          image: abmaxx/tetris-v2:44e97517e2263da8fa4db55b3d406ee81e099577
          ports:
            - containerPort: 80
